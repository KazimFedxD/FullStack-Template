<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Background animations */
        @keyframes pulseBG {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        @keyframes drift {
            0% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-20px) translateY(15px); }
            100% { transform: translateX(0) translateY(0); }
        }
        
        @keyframes cloudMove {
            0% { background-position: 0 0; }
            100% { background-position: 1000px 500px; }
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #020617; /* Fallback */
            color: #f1f5f9;
            text-align: center;
            padding: 32px 8px;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Background layers - Generic dark theme */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, #030712, #0f172a, #000000);
            animation: pulseBG 12s ease-in-out infinite;
            z-index: -3;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.15), transparent 60%),
                radial-gradient(circle at 70% 30%, rgba(34, 197, 94, 0.18), transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.22), transparent 55%),
                radial-gradient(circle at 85% 75%, rgba(16, 185, 129, 0.15), transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(96, 165, 250, 0.18), transparent 55%);
            animation: drift 40s linear infinite;
            z-index: -2;
        }
        
        .storm-texture {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
            opacity: 0.3;
            animation: cloudMove 60s linear infinite;
            z-index: -1;
        }
        
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        
        .code {
            font-size: 2.5rem;
            font-weight: 700;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid #60a5fa;
            border-radius: 12px;
            padding: 24px 40px;
            letter-spacing: 8px;
            margin: 24px 0;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }
        
        p {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.6;
            margin: 12px 0;
        }
        
        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 0.875rem;
        }
        
        .link {
            color: #60a5fa;
            text-decoration: none;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .button {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 16px 0;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        
        .button:hover {
            background: linear-gradient(90deg, #2563eb 0%, #059669 100%);
        }
        
        .warning {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 16px;
            margin: 16px 0;
            color: #fecaca;
            border-radius: 8px;
        }
        
        .success {
            background: rgba(34, 197, 94, 0.1);
            border-left: 4px solid #22c55e;
            padding: 16px;
            margin: 16px 0;
            color: #86efac;
            border-radius: 8px;
        }
        
        .info {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            padding: 16px;
            margin: 16px 0;
            color: #bfdbfe;
            border-radius: 8px;
        }
            
            .weather-icon {
                width: 24px;
                height: 24px;
                color: white;
                flex-shrink: 0;
            }
            
            .temperature {
                font-size: 3rem;
                font-weight: 700;
                line-height: 1;
                color: white;
                margin: 0;
            }
            
            .weather-condition {
                font-size: 0.75rem;
                opacity: 0.7;
    </style>
</head>
